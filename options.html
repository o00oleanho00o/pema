<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tách đơn - Cài đặt</title><link rel="stylesheet" href="options.css"></head>
<body><main><h1>Cài đặt Tách đơn</h1><section class="panel"><h2>Danh mục</h2><p class="muted">Chỉ dùng một file: <code>danhsach.xlsx</code>. Dữ liệu danh mục được lưu local trong trình duyệt.</p><input id="file" type="file" accept=".xlsx"><button id="import" type="button">Import / Cập nhật danh sách</button><p id="result" role="status"></p><dl id="stats"></dl></section><section class="panel"><h2>Matching</h2><label><input id="fuzzyEnabled" type="checkbox"> Cho phép gợi ý fuzzy cần review</label><label for="threshold">Ngưỡng fuzzy: <output id="thresholdValue">0.86</output></label><input id="threshold" type="range" min="0.70" max="0.98" step="0.01" value="0.86"></section><section class="panel"><h2>Quyền riêng tư</h2><p class="muted">Prescription hiện tại chỉ tồn tại trong phiên đọc/preview. Không lưu lịch sử bệnh nhân, cookie, token hoặc dữ liệu lên server.</p></section></main><script src="jszip.min.js"></script><script src="catalog.js"></script><script src="xlsx-importer.js"></script><script src="options.js"></script></body></html>
